name: Build NetQuality APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Add iperf3 Android ARM64 engine
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 "https://raw.githubusercontent.com/davidBar-On/android-iperf3/gh-pages/libs/arm64-v8a/iperf3.21" -o app/src/main/assets/iperf3-arm64
          file app/src/main/assets/iperf3-arm64

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetQuality-APK
          path: app/build/outputs/apk/debug/app-debug.apk
